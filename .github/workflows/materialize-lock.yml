name: materialize-lock

on:
  push:
    branches:
      - impl/stage-1-deterministic-foundation

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/stage-1-deterministic-foundation
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv lock
      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: lock Python dependencies [skip ci]"
          git push origin HEAD:impl/stage-1-deterministic-foundation
