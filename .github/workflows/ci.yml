name: ci

on:
 # push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: infinite_interns
          POSTGRES_USER: interns
          POSTGRES_PASSWORD: interns
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interns -d infinite_interns"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      INFINITE_INTERNS_DATABASE_URL: postgresql+psycopg://interns:interns@127.0.0.1:5432/infinite_interns
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run pytest tests/unit -q
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/integration -q
      - run: uv run pyright
